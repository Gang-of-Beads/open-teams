name: iOS

# Builds the experimental iOS wrapper in ios/ as an unsigned .ipa for
# sideloading (SideStore, AltStore, Sideloadly re-sign it on install) and
# publishes it as a GitHub pre-release. Runs only when an ios-v* tag (for
# example ios-v0.1.0) is pushed. The release is never marked latest, so
# releases/latest keeps pointing at the desktop app's release-please release.

on:
  push:
    tags:
      - "ios-v*"

# Restrict default permissions — each job declares only what it needs
permissions: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ipa: ${{ steps.package.outputs.ipa }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      # The app version comes from the tag: ios-v1.2.3 builds 1.2.3.
      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#ios-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag $REF_NAME must look like ios-v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild build \
            -project ios/OpenTeams.xcodeproj \
            -scheme OpenTeams \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Sideloading tools replace the signature anyway; an ad-hoc signature
      # just gives them a well-formed bundle to start from.
      - name: Package ipa
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/OpenTeams.app"
          stage="$RUNNER_TEMP/ipa"
          ipa="OpenTeams-$VERSION.ipa"
          mkdir -p "$stage/Payload" dist
          cp -R "$app" "$stage/Payload/"
          codesign --force --sign - --timestamp=none "$stage/Payload/OpenTeams.app"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/$ipa" Payload)
          (cd dist && shasum -a 256 "$ipa" > "$ipa.sha256")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist"
          ls -l dist
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ipa artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          IPA: ${{ needs.build.outputs.ipa }}
        run: |
          notes=$(cat <<EOF
          Experimental iOS / iPadOS build of Open Teams (WKWebView wrapper around Teams web).

          **Unsigned** — install with SideStore, AltStore or Sideloadly, which re-sign it with your Apple ID. Requires iOS 16.4 or later.

          See [ios/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/ios/README.md) for notifications, background behaviour and known limitations.

          SHA-256: \`$(cut -d' ' -f1 "dist/$IPA.sha256")\`
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "iOS $VERSION" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi
